services:
  mariadb:
    image: mariadb:11.8.9
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run make setup-dev}
      MARIADB_DATABASE: portal_db
      MARIADB_USER: portal
      MARIADB_PASSWORD: ${PORTAL_DB_PASSWORD:?Run make setup-dev}
      TZ: Asia/Seoul
    volumes:
      - maria-data:/var/lib/mysql
    networks:
      - maria-data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24
volumes:
  maria-data:
networks:
  maria-data:
    name: ${PRISM_DB_NETWORK:?Select the database network}
